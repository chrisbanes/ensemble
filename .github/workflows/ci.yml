name: CI

on:
  push:
    branches: [main]
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  SKIP_UI_BUILD: 1

jobs:
  ci:
    name: Check, Test, Clippy, Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Cheapest checks first — fail fast
      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --exclude ensemble-desktop -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude ensemble-desktop

  frontend:
    name: Frontend Test and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: crates/ensemble-ui/src-ui/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: crates/ensemble-ui/src-ui/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: crates/ensemble-ui/src-ui

      - name: Generate frontend API client
        run: pnpm run codegen
        working-directory: crates/ensemble-ui/src-ui

      - name: Frontend unit tests
        run: pnpm test
        working-directory: crates/ensemble-ui/src-ui

      - name: Frontend build
        run: pnpm run build:embed
        working-directory: crates/ensemble-ui/src-ui

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: crates/ensemble-ui/src-ui/dist/
          retention-days: 1

  # Fast PR/desktop compile job. Runs in parallel with `ci` and `frontend`
  # (no `needs:`), so PR feedback is bounded by the slowest of the three.
  # Decision from Task 1: cargo test -p ensemble-desktop links the bin target
  # which uses tauri::Builder with WebviewWindowBuilder, so on Linux webkit2gtk
  # must be installed for the test binary to link and run.
  tauri-pr:
    name: Tauri PR (${{ matrix.name }})
    if: "!startsWith(github.ref, 'refs/tags/v')"
    strategy:
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: Mac
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri system dependencies (Linux)
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb

      - name: Run desktop check
        run: cargo check -p ensemble-desktop --all-targets
        env:
          SKIP_UI_BUILD: 1

      - name: Run desktop unit tests
        run: cargo test -p ensemble-desktop --bin ensemble-desktop -- --nocapture
        env:
          SKIP_UI_BUILD: 1

      - name: Run E2E smoke test (verify app launches)
        run: ${{ matrix.runner == 'ubuntu-latest' && 'xvfb-run -a' || '' }} cargo test -p ensemble-desktop --test e2e app_launches_without_crash -- --ignored --nocapture
        timeout-minutes: 2

  # Full Tauri bundle (dmg/deb/AppImage). Runs on:
  #   - push to main (any branch push; no paths filter)
  #   - schedule (daily 06:00 UTC) to catch packaging regressions
  #   - push of a tag
  # PRs do NOT hit this job; PR feedback is the tauri-pr job above.
  tauri-bundle:
    name: Tauri Bundle (${{ matrix.name }})
    needs: frontend
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && (github.ref_type == 'tag' || github.ref_type == 'branch'))
    strategy:
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: Mac
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: crates/ensemble-ui/src-ui/dist/

      - name: Copy dist to desktop assets for rust-embed
        run: |
          mkdir -p crates/ensemble-desktop/assets/spa
          cp -r crates/ensemble-ui/src-ui/dist/* crates/ensemble-desktop/assets/spa/

      # pnpm + node needed for tauri CLI install
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: crates/ensemble-ui/src-ui/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.3

      - name: Install Tauri CLI
        run: pnpm install -g @tauri-apps/cli

      - name: Install Tauri system dependencies (Linux)
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb

      - name: Run desktop unit tests
        run: cargo test -p ensemble-desktop --bin ensemble-desktop -- --nocapture
        env:
          SKIP_UI_BUILD: 1

      - name: Build Tauri app
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: tauri build
        working-directory: crates/ensemble-desktop

      - name: Build Tauri app (signed)
        if: startsWith(github.ref, 'refs/tags/v')
        run: tauri build
        working-directory: crates/ensemble-desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}

      - name: Run E2E smoke test (verify app launches)
        run: ${{ matrix.runner == 'ubuntu-latest' && 'xvfb-run -a' || '' }} cargo test -p ensemble-desktop --test e2e app_launches_without_crash -- --ignored --nocapture
        timeout-minutes: 2

      - name: Upload desktop artifacts
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            target/**/*.dmg
            target/**/*.deb
            target/**/*.AppImage
          retention-days: 7

  # --- Release-only jobs (tag pushes) ---

  build-cli:
    name: CLI (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: crates/ensemble-cli/assets/spa/

      - name: Build CLI
        run: cargo build --release -p ensemble-cli --target ${{ matrix.target }}

      - name: Package binary
        run: |
          ARCHIVE="ensemble-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE" -C target/${{ matrix.target }}/release ensemble
          echo "archive=$ARCHIVE" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: ${{ env.archive }}

  release:
    name: Release & Homebrew
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-cli, tauri-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: cli-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: desktop-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          ARTIFACTS_DIR: artifacts
        run: .github/update-homebrew.sh
