name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare writable test directories
        env:
          TMPDIR: ${{ runner.temp }}/ensemble-fixture-tmp
          ENSEMBLE_TEST_EVIDENCE_DIR: ${{ runner.temp }}/ensemble-test-evidence
        run: |
          mkdir -p "$TMPDIR" "$ENSEMBLE_TEST_EVIDENCE_DIR"
          test -w "$TMPDIR"
          test -w "$ENSEMBLE_TEST_EVIDENCE_DIR"
          printf 'TMPDIR=%s\nENSEMBLE_TEST_EVIDENCE_DIR=%s\n' "$TMPDIR" "$ENSEMBLE_TEST_EVIDENCE_DIR" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@12.2.0
      - run: npm ci
      # Skip man-db's index rebuild during apt installs of browser dependencies.
      - run: sudo rm -f /var/lib/man-db/auto-update
      # Tests launch headless only, so the full Chrome binary is not needed.
      - run: npx playwright install --with-deps --only-shell chromium webkit
      - run: npm run test:fixture-preflight
      - run: npm run check
      - name: Upload synthetic test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ensemble-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ensemble-test-evidence
          retention-days: 3
          if-no-files-found: error
