name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  SKIP_UI_BUILD: 1

jobs:
  ci:
    name: Check, Test, Clippy, Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Cheapest checks first — fail fast
      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --exclude ensemble-desktop -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude ensemble-desktop

  frontend:
    name: Frontend Test and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: crates/ensemble-ui/src-ui/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/ensemble-ui/src-ui/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: crates/ensemble-ui/src-ui

      - name: Generate frontend API client
        run: pnpm run codegen
        working-directory: crates/ensemble-ui/src-ui

      - name: Frontend unit tests
        run: pnpm test
        working-directory: crates/ensemble-ui/src-ui

      - name: Frontend build
        run: pnpm run build:embed
        working-directory: crates/ensemble-ui/src-ui

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: crates/ensemble-ui/src-ui/dist/
          retention-days: 1

  tauri:
    name: Build Desktop App (${{ matrix.name }})
    strategy:
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: Mac
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    needs: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: crates/ensemble-ui/src-ui/dist/

      # pnpm + node needed for tauri CLI install
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: crates/ensemble-ui/src-ui/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/ensemble-ui/src-ui/pnpm-lock.yaml

      - name: Install Tauri CLI
        run: pnpm install -g @tauri-apps/cli

      - name: Install Tauri system dependencies (Linux)
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build Tauri app
        run: tauri build
        working-directory: crates/ensemble-desktop
