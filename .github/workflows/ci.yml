name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    name: ${{ matrix.job }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # `check` is the required status context; keep its name unchanged.
          - job: check
            runtime: node24
          - job: check-node-26
            runtime: node26
            node-version: "26"
    steps:
      - name: Prepare writable test directories
        env:
          TMPDIR: ${{ runner.temp }}/ensemble-fixture-tmp
          ENSEMBLE_TEST_EVIDENCE_DIR: ${{ runner.temp }}/ensemble-test-evidence
        run: |
          mkdir -p "$TMPDIR" "$ENSEMBLE_TEST_EVIDENCE_DIR"
          test -w "$TMPDIR"
          test -w "$ENSEMBLE_TEST_EVIDENCE_DIR"
          printf 'TMPDIR=%s\nENSEMBLE_TEST_EVIDENCE_DIR=%s\n' "$TMPDIR" "$ENSEMBLE_TEST_EVIDENCE_DIR" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: .node-version
          cache: npm
      - run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: node --version && npm --version
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:fixture-preflight
      - run: npm run check
      - name: Upload synthetic test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ensemble-test-evidence-${{ matrix.runtime }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ensemble-test-evidence
          retention-days: 3
          if-no-files-found: error
