name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TMPDIR: ${{ runner.temp }}/ensemble-fixture-tmp
      ENSEMBLE_TEST_EVIDENCE_DIR: ${{ runner.temp }}/ensemble-test-evidence
    steps:
      - name: Prepare writable test directories
        run: mkdir -p "$TMPDIR" "$ENSEMBLE_TEST_EVIDENCE_DIR" && test -w "$TMPDIR" && test -w "$ENSEMBLE_TEST_EVIDENCE_DIR"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:fixture-preflight
      - run: npm run check
      - name: Upload synthetic test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ensemble-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ENSEMBLE_TEST_EVIDENCE_DIR }}
          retention-days: 3
          if-no-files-found: error
