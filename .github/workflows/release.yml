name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build frontend once, share via artifact
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: crates/ensemble-ui/src-ui/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/ensemble-ui/src-ui/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: crates/ensemble-ui/src-ui

      - name: Generate OpenAPI spec
        run: cargo test -p ensemble-core --test openapi_spec write_openapi_spec -- --ignored

      - name: Generate frontend API client
        run: pnpm run codegen:client
        working-directory: crates/ensemble-ui/src-ui

      - name: Build frontend
        run: pnpm run build:embed
        working-directory: crates/ensemble-ui/src-ui

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: crates/ensemble-ui/src-ui/dist/
          retention-days: 1

  # Build CLI binaries for all targets
  build-cli:
    name: CLI (${{ matrix.target }})
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: crates/ensemble-cli/assets/spa/

      - name: Build CLI
        run: cargo build --release -p ensemble-cli --target ${{ matrix.target }}
        env:
          SKIP_UI_BUILD: 1

      - name: Package binary
        run: |
          ARCHIVE="ensemble-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE" -C target/${{ matrix.target }}/release ensemble
          echo "archive=$ARCHIVE" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: ${{ env.archive }}

  # Build Tauri desktop app (macOS aarch64)
  build-tauri:
    name: Desktop (Mac aarch64)
    needs: frontend
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: crates/ensemble-ui/src-ui/dist/

      - name: Copy dist to desktop assets for rust-embed
        run: |
          mkdir -p crates/ensemble-desktop/assets/spa
          cp -r crates/ensemble-ui/src-ui/dist/* crates/ensemble-desktop/assets/spa/

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: crates/ensemble-ui/src-ui/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Tauri CLI
        run: pnpm install -g @tauri-apps/cli

      - name: Build Tauri app
        run: tauri build
        working-directory: crates/ensemble-desktop
        env:
          SKIP_UI_BUILD: 1
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}

      - name: Find .dmg
        id: dmg
        run: |
          DMG=$(find target -name '*.dmg' -type f | head -1)
          echo "path=$DMG" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-dmg
          path: ${{ steps.dmg.outputs.path }}

  # Create GitHub Release and update Homebrew tap
  release:
    name: Release & Homebrew
    needs: [build-cli, build-tauri]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          ARTIFACTS_DIR: artifacts
        run: .github/update-homebrew.sh
