name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build CLI binaries for all targets
  build-cli:
    name: CLI (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: crates/ensemble-ui/src-ui/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/ensemble-ui/src-ui/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: crates/ensemble-ui/src-ui

      - name: Generate OpenAPI spec
        run: cargo test -p ensemble-core --test openapi_spec write_openapi_spec -- --ignored

      - name: Build CLI
        run: cargo build --release -p ensemble-cli

      - name: Package binary
        run: |
          ARCHIVE="ensemble-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE" -C target/release ensemble
          echo "archive=$ARCHIVE" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: ${{ env.archive }}

  # Build Tauri desktop app (macOS aarch64)
  build-tauri:
    name: Desktop (macOS aarch64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: crates/ensemble-ui/src-ui/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/ensemble-ui/src-ui/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: crates/ensemble-ui/src-ui

      - name: Generate OpenAPI spec
        run: cargo test -p ensemble-core --test openapi_spec write_openapi_spec -- --ignored

      - name: Generate frontend API client
        run: pnpm run codegen:client
        working-directory: crates/ensemble-ui/src-ui

      - name: Build frontend
        run: pnpm run build
        working-directory: crates/ensemble-ui/src-ui

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        with:
          tauriScript: cargo
          args: --target aarch64-apple-darwin
          projectPath: crates/ensemble-desktop

      - name: Find .dmg
        id: dmg
        run: |
          DMG=$(find target -name '*.dmg' -type f | head -1)
          echo "path=$DMG" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-dmg
          path: ${{ steps.dmg.outputs.path }}

  # Create GitHub Release with all artifacts
  release:
    name: GitHub Release
    needs: [build-cli, build-tauri]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  # Update Homebrew tap (formula + cask)
  update-homebrew:
    name: Update Homebrew Tap
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --dir ./artifacts

      - name: Compute checksums
        id: sha
        run: |
          TAG="${{ github.ref_name }}"

          for f in artifacts/ensemble-${TAG}-*.tar.gz; do
            TARGET=$(basename "$f" | sed "s/ensemble-${TAG}-//" | sed 's/\.tar\.gz//')
            SHA=$(sha256sum "$f" | awk '{print $1}')
            echo "${TARGET}_sha256=$SHA" >> "$GITHUB_OUTPUT"
          done

          DMG=$(ls artifacts/*.dmg | head -1)
          echo "dmg_name=$(basename "$DMG")" >> "$GITHUB_OUTPUT"
          echo "dmg_sha256=$(sha256sum "$DMG" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Clone tap
        run: |
          git clone "https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/chrisbanes/homebrew-tap.git" tap
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          mkdir -p tap/Formula
          cat > tap/Formula/ensemble.rb << FORMULA
class Ensemble < Formula
  desc "Multi-agent pipeline orchestrator"
  homepage "https://github.com/${REPO}"
  license "MIT"
  version "${VERSION}"

  on_macos do
    on_arm do
      url "https://github.com/${REPO}/releases/download/${TAG}/ensemble-${TAG}-aarch64-apple-darwin.tar.gz"
      sha256 "${{ steps.sha.outputs.aarch64-apple-darwin_sha256 }}"
    end
  end

  on_linux do
    on_arm do
      url "https://github.com/${REPO}/releases/download/${TAG}/ensemble-${TAG}-aarch64-unknown-linux-gnu.tar.gz"
      sha256 "${{ steps.sha.outputs.aarch64-unknown-linux-gnu_sha256 }}"
    end
    on_intel do
      url "https://github.com/${REPO}/releases/download/${TAG}/ensemble-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
      sha256 "${{ steps.sha.outputs.x86_64-unknown-linux-gnu_sha256 }}"
    end
  end

  def install
    bin.install "ensemble"
  end

  test do
    assert_match "ensemble", shell_output("\#{bin}/ensemble --help")
  end
end
FORMULA

      - name: Generate cask
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          DMG_NAME="${{ steps.sha.outputs.dmg_name }}"
          mkdir -p tap/Casks
          cat > tap/Casks/ensemble-desktop.rb << CASK
cask "ensemble-desktop" do
  version "${VERSION}"
  sha256 "${{ steps.sha.outputs.dmg_sha256 }}"

  url "https://github.com/${REPO}/releases/download/${TAG}/${DMG_NAME}"
  name "Ensemble"
  desc "Multi-agent pipeline orchestrator"
  homepage "https://github.com/${REPO}"

  depends_on arch: :arm64

  app "Ensemble.app"
end
CASK

      - name: Push to tap
        working-directory: tap
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git add Formula/ensemble.rb Casks/ensemble-desktop.rb
          git commit -m "Update ensemble to ${VERSION}"
          git push
