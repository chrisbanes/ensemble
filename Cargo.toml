[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
rust-version = "1.95"
repository = "https://github.com/chrisbanes/ensemble"

[workspace.dependencies]
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
liquid = "0.26.11"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
thiserror = "2.0.19"
chrono = { version = "0.4.45", features = ["serde"] }
tempfile = "3.27.0"
async-trait = "0.1.91"
reqwest = { version = "0.13.4", features = ["json"] }
futures = "0.3.33"
libc = "0.2.189"
wiremock = "0.6.5"
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.33"
async-stream = "0.3.6"
tower-http = { version = "0.7.0", features = ["cors", "fs"] }
tower = "0.5.3"
clap = { version = "4.6.4", features = ["derive", "env"] }
inquire = "0.9.4"
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono"] }
rust-embed = { version = "8.12.0", features = ["axum"] }
dirs = "6"
dotenvy = "0.15.7"
shellexpand = "3.1.2"
mime_guess = "2.0.5"
opener = "0.8.5"
rusqlite = { version = "0.40.1", features = ["bundled", "fallible_uint"] }
agent-client-protocol = "2.0.0"
notify = "8.2.0"
pulldown-cmark = "0.13.4"
shell-words = "1.1.1"
